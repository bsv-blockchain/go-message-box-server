services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: messagebox
      POSTGRES_PASSWORD: messagebox
      POSTGRES_DB: messagebox
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messagebox"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Only started with the mongo profile:
  #   STORAGE_BACKEND=mongo docker compose --profile mongo up
  mongo:
    profiles: ["mongo"]
    image: mongo:8.2
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  messagebox:
    build: .
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      PORT: 8080
      SERVER_PRIVATE_KEY: 4f1f715fd10bfa3549d3caf487a4be95523d7bcb8f82abe1a3c91494a09c05f5
      # STORAGE_BACKEND=mongo docker compose --profile mongo up
      STORAGE_BACKEND: ${STORAGE_BACKEND:-sql}
      DB_DRIVER: ${DB_DRIVER:-postgres}
      DB_SOURCE: postgres://messagebox:messagebox@postgres:5432/messagebox?sslmode=disable
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: messagebox
      BSV_NETWORK: mainnet
      WALLET_STORAGE_URL: https://store-us-1.bsvb.tech
    depends_on:
      # Both are optional so either backend can run alone: a hard dependency on
      # mongo would break a profile-less `docker compose up`, since compose
      # rejects depending on a profile-disabled service. required:false needs
      # Compose v2.20+.
      postgres:
        condition: service_healthy
        required: false
      mongo:
        condition: service_healthy
        required: false
    restart: unless-stopped

volumes:
  postgres-data:
  mongo-data:
